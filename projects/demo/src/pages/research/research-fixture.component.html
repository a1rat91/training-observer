<main>
    <h2>Заявка на обучение</h2>
    <form aria-label="Заявка на обучение">
        <tui-textfield>
            <label tuiLabel>ФИО</label>
            <input
                name="employee"
                tuiTextfield
                [(ngModel)]="employee"
            />
        </tui-textfield>
        <tui-textfield>
            <label tuiLabel>Рабочая почта</label>
            <input
                name="email"
                tuiTextfield
                type="email"
                [(ngModel)]="email"
            />
        </tui-textfield>
        <tui-textfield>
            <label tuiLabel>Курс</label>
            <input
                name="course"
                tuiSelect
                [(ngModel)]="course"
            />
            <tui-data-list-wrapper
                *tuiTextfieldDropdown
                new
                [items]="courses"
            />
        </tui-textfield>
        <tui-textfield>
            <label tuiLabel>Бюджет</label>
            <input
                name="budget"
                tuiInputNumber
                [(ngModel)]="budget"
            />
        </tui-textfield>
        <label>
            <input
                name="consent"
                tuiCheckbox
                type="checkbox"
                [(ngModel)]="consent"
            />
            Согласие
        </label>
        <label>
            <input
                name="mentor"
                tuiSwitch
                type="checkbox"
                [(ngModel)]="mentor"
            />
            Нужен наставник
        </label>
        <tui-textfield>
            <label tuiLabel>Комментарий</label>
            <textarea
                name="comment"
                tuiTextarea
                [(ngModel)]="comment"
            ></textarea>
        </tui-textfield>
        <tui-textfield>
            <label tuiLabel>Дата начала</label>
            <input
                name="date"
                tuiInputDate
                [(ngModel)]="date"
            />
        </tui-textfield>
        <button
            tuiButton
            type="button"
        >
            <span>Продолжить</span>
        </button>
        <button
            aria-label="Открыть справку"
            tuiButton
            type="button"
        >
            <span aria-hidden="true">?</span>
        </button>
    </form>
    <fieldset>
        <legend>Анна</legend>
        <button
            tuiButton
            type="button"
        >
            Редактировать
        </button>
    </fieldset>
    <fieldset>
        <legend>Борис</legend>
        <button
            tuiButton
            type="button"
        >
            Редактировать
        </button>
    </fieldset>
    <section aria-label="Неразличимые действия">
        <button
            tuiButton
            type="button"
        >
            Действие
        </button>
        <button
            tuiButton
            type="button"
        >
            Действие
        </button>
    </section>
</main>
